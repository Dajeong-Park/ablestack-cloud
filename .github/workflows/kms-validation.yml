name: KMS Focused Validation

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or branch to validate
        required: false
        type: string

concurrency:
  group: kms-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  kms:
    if: github.repository == 'dhslove/ablestack-cloud'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MAVEN_OPTS: >-
        -Dcom.sun.xml.bind.v2.bytecode.ClassTailor.noOptimize=true
        --add-opens=java.base/java.lang=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: ./.github/actions/setup-env
        with:
          install-python: 'true'
          install-apt-deps: 'true'
      - name: Test and package the changed management module and its dependencies
        run: |
          mvn -B -pl server -am -Pdeveloper \
            '-Dtest=KMSManagerImpl*Test' \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false \
            package 2>&1 | tee kms-build.log
      - name: Assemble a class patch and source receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          jar = Path("server/target/cloud-server-4.23.0.0.jar")
          output = Path("dist/kms-validation")
          output.mkdir(parents=True, exist_ok=True)
          reports = list(Path("server/target/surefire-reports").glob("TEST-*.xml"))
          totals = dict.fromkeys(["tests", "failures", "errors", "skipped"], 0)
          found = False
          for report in reports:
              root = ET.parse(report).getroot()
              found |= root.get("name", "").endswith("KMSManagerImplRotationMetadataTest")
              for key in totals:
                  totals[key] += int(root.get(key, "0"))
          assert found and totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0, totals
          classes = {}
          patch = output / "kms-management-classes.jar"
          with zipfile.ZipFile(jar) as original, zipfile.ZipFile(patch, "w", zipfile.ZIP_DEFLATED) as target:
              for name in original.namelist():
                  if name.startswith("org/apache/cloudstack/kms/KMSManagerImpl") and name.endswith(".class"):
                      data = original.read(name)
                      classes[name] = hashlib.sha256(data).hexdigest()
                      target.writestr(name, data)
          assert "org/apache/cloudstack/kms/KMSManagerImpl.class" in classes
          receipt = {"source_commit": source, "workflow_run": os.environ["GITHUB_RUN_ID"],
                     "server_jar_sha256": hashlib.sha256(jar.read_bytes()).hexdigest(),
                     "classes": classes, "tests": totals}
          (output / "source-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          notes = ("# Epic #1727 / KM-01 관리 서버 클래스 검증\n\n"
                   + "- 소스: " + source + "\n"
                   + "- Actions: https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                   + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "\n"
                   + "- KMS 집중 회귀: " + json.dumps(totals) + "\n"
                   + "- 기존 관리 서버 JAR 백업 후 지정된 KMS 클래스만 적용하는 시험용 산출물입니다.\n")
          (output / "release-notes.md").write_text(notes)
          (output / "SHA256SUMS").write_text("".join(
              hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n"
              for p in sorted(output.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kms-validation-${{ github.run_id }}
          path: |
            server/target/surefire-reports/TEST-*.xml
            kms-build.log
            dist/kms-validation/
          if-no-files-found: warn
      - name: Publish the latest disposable KMS development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          source_sha=$(git rev-parse HEAD)
          tag=dev-epic1727-kms-latest
          if gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$RELEASE_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$tag" --repo "$RELEASE_REPOSITORY" \
            --target "$source_sha" --prerelease \
            --title 'Epic #1727 KMS 관리 서버 검증용 최신 빌드' \
            --notes-file dist/kms-validation/release-notes.md \
            dist/kms-validation/kms-management-classes.jar \
            dist/kms-validation/source-receipt.json \
            dist/kms-validation/SHA256SUMS

