name: KVM System VM Template

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the System VM sources
        required: true
        type: string
      version:
        description: Product version embedded in the image name
        required: true
        type: string
      build_number:
        description: Release build number embedded in the image name
        required: true
        type: string
      artifact_name:
        description: GitHub Actions artifact name
        required: true
        type: string
      release_display_version:
        description: ABLESTACK display version recorded in the build manifest
        required: false
        default: ''
        type: string
    secrets:
      storage_runtime_signing_private_key:
        description: Stable protected Ed25519 private key for published runtime bundles
        required: true

permissions:
  contents: read

jobs:
  build-systemvm-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      PACKER_VERSION: 1.9.4
      SYSTEMVM_REF: ${{ inputs.ref }}
      SYSTEMVM_VERSION: ${{ inputs.version }}
      SYSTEMVM_BUILD_NUMBER: ${{ inputs.build_number }}
      SYSTEMVM_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      SYSTEMVM_RELEASE_DISPLAY_VERSION: ${{ inputs.release_display_version }}
      SYSTEMVM_ISO_CACHE: ${{ github.workspace }}/.cache/systemvm
      STORAGE_RUNTIME_SIGNING_KEY_ID: ablestack-runtime-release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SYSTEMVM_REF }}
          fetch-depth: 0

      - name: Prepare Storage Service runtime signing key
        env:
          STORAGE_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.storage_runtime_signing_private_key }}
        run: |
          key_dir="$RUNNER_TEMP/storage-runtime-signing"
          mkdir -p "$key_dir" systemvm/debian/etc/ablestack-storage/runtime-trusted-keys
          private_key="$key_dir/private.pem"
          if [ -n "$STORAGE_RUNTIME_SIGNING_PRIVATE_KEY" ]; then
            printf '%s' "$STORAGE_RUNTIME_SIGNING_PRIVATE_KEY" > "$private_key"
          else
            echo "::error::Stable storage_runtime_signing_private_key is required; refusing an ephemeral release key"
            exit 1
          fi
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout \
            -out "systemvm/debian/etc/ablestack-storage/runtime-trusted-keys/${STORAGE_RUNTIME_SIGNING_KEY_ID}.pem"
          echo "STORAGE_RUNTIME_SIGNING_PRIVATE_KEY_FILE=$private_key" >> "$GITHUB_ENV"

      - name: Restore Debian installer ISO cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/systemvm
          key: systemvm-debian-12.12.0-amd64-c93055182057dd19

      - name: Install KVM System VM build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bzip2 \
            curl \
            jq \
            qemu-system-x86 \
            qemu-utils \
            sharutils \
            unzip

          packer_archive="packer_${PACKER_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${packer_archive}"
          curl -fsSLO "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS"
          grep " ${packer_archive}$" "packer_${PACKER_VERSION}_SHA256SUMS" | sha256sum -c -
          sudo unzip -o "$packer_archive" -d /usr/local/bin
          rm -f "$packer_archive" "packer_${PACKER_VERSION}_SHA256SUMS"
          packer version

      - name: Download and verify Debian installer ISO
        run: |
          template=tools/appliance/systemvmtemplate/template-base_x86_64-target_x86_64.json
          iso_url=$(jq -r '.builders[0].iso_url' "$template")
          iso_checksum=$(jq -r '.builders[0].iso_checksum' "$template")
          iso_checksum=${iso_checksum#sha512:}
          iso_path="$SYSTEMVM_ISO_CACHE/$(basename "$iso_url")"
          mkdir -p "$SYSTEMVM_ISO_CACHE"

          if [ -f "$iso_path" ] &&
             ! printf '%s  %s\n' "$iso_checksum" "$iso_path" | sha512sum -c -; then
            rm -f "$iso_path"
          fi

          if [ ! -f "$iso_path" ]; then
            partial_path="${iso_path}.part"
            rm -f "$partial_path"
            curl \
              --fail \
              --location \
              --retry 8 \
              --retry-delay 15 \
              --retry-all-errors \
              --connect-timeout 60 \
              --max-time 3600 \
              --output "$partial_path" \
              "$iso_url"
            printf '%s  %s\n' "$iso_checksum" "$partial_path" | sha512sum -c -
            mv "$partial_path" "$iso_path"
          fi

          local_iso_url=$(python3 -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$iso_path")
          jq --arg iso_url "$local_iso_url" \
            '.builders[0].iso_url = $iso_url' \
            "$template" > "${template}.tmp"
          mv "${template}.tmp" "$template"
          jq -e '.builders[0].iso_url | startswith("file://")' "$template"

      - name: Validate KVM and NBD support
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::The runner does not provide /dev/kvm; a KVM-capable runner is required"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::The runner cannot access /dev/kvm"
            exit 1
          fi

          sudo modprobe nbd max_part=8
          if [ ! -b /dev/nbd7 ]; then
            echo "::error::The runner did not create /dev/nbd7 after loading the nbd module"
            exit 1
          fi

          qemu-system-x86_64 --version
          qemu-img --version

      - name: Build signed Storage Service runtime bundle
        env:
          ABLESTACK_STORAGE_RUNTIME_BUILD_TIME: ${{ inputs.release_display_version }}
        run: |
          export ABLESTACK_STORAGE_RUNTIME_BUILD_COMMIT="$(git rev-parse HEAD)"
          runtime_version="${SYSTEMVM_VERSION}-${SYSTEMVM_BUILD_NUMBER}"
          runtime_dir="dist/systemvm-kvm/release/storage-runtime"
          tools/build/build-storage-runtime-bundle.sh \
            --version "$runtime_version" \
            --private-key "$STORAGE_RUNTIME_SIGNING_PRIVATE_KEY_FILE" \
            --key-id "$STORAGE_RUNTIME_SIGNING_KEY_ID" \
            --output-dir "$runtime_dir"
          (cd "$runtime_dir" && sha256sum -c SHA256SUMS)
          openssl pkeyutl -verify -pubin \
            -inkey "systemvm/debian/etc/ablestack-storage/runtime-trusted-keys/${STORAGE_RUNTIME_SIGNING_KEY_ID}.pem" \
            -sigfile "$runtime_dir/manifest.sig" -rawin -in "$runtime_dir/manifest.json"
          install -d -m 0755 systemvm/debian/etc/ablestack-storage/runtime-default
          install -m 0644 "$runtime_dir/manifest.json" systemvm/debian/etc/ablestack-storage/runtime-default/manifest.json
          install -m 0644 "$runtime_dir/manifest.sig" systemvm/debian/etc/ablestack-storage/runtime-default/manifest.sig

      - name: Build KVM System VM template
        run: |
          mkdir -p dist/systemvm-kvm
          set -o pipefail
          cd tools/appliance
          sudo -E env \
            PATH="$PATH" \
            PACKER_LOG=1 \
            bash ./build.sh \
              systemvmtemplate \
              "$SYSTEMVM_VERSION" \
              x86_64 \
              "$SYSTEMVM_BUILD_NUMBER" \
            2>&1 | tee "$GITHUB_WORKSPACE/dist/systemvm-kvm/systemvm-kvm-build.log"
          sudo chown -R "$(id -u):$(id -g)" dist "$GITHUB_WORKSPACE/dist/systemvm-kvm"

      - name: Validate and stage KVM System VM artifact
        run: |
          mapfile -t images < <(
            find tools/appliance/dist -maxdepth 1 -type f \
              -name 'systemvmtemplate-*-x86_64-kvm-*.qcow2.bz2' \
              -print
          )
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one KVM qcow2.bz2 image, found ${#images[@]}"
            printf '%s\n' "${images[@]}"
            exit 1
          fi

          mapfile -t unexpected_images < <(
            find tools/appliance/dist -maxdepth 1 -type f \
              \( -name '*.ova' -o -name '*.vmdk' -o -name '*-xen.*' \
                 -o -name '*-ovm.*' -o -name '*-hyperv.*' \) \
              -print
          )
          if [ "${#unexpected_images[@]}" -ne 0 ]; then
            echo "::error::Non-KVM System VM artifacts were generated"
            printf '%s\n' "${unexpected_images[@]}"
            exit 1
          fi

          image="${images[0]}"
          roundtrip_image=$(mktemp /tmp/systemvm-kvm-roundtrip.XXXXXX.qcow2)
          trap 'rm -f "$roundtrip_image"' EXIT
          bunzip2 -c "$image" > "$roundtrip_image"
          qemu-img check "$roundtrip_image"
          sudo env SYSTEMVM_VALIDATE_NBD_DEVICE=/dev/nbd7 \
            tools/appliance/scripts/validate_systemvm_image.sh "$roundtrip_image"

          stage_dir=dist/systemvm-kvm/release
          mkdir -p "$stage_dir"
          cp "$image" "$stage_dir/"
          (
            cd "$stage_dir"
            sha256sum "$(basename "$image")" > SYSTEMVM-SHA256SUMS
          )

          cat > "$stage_dir/SYSTEMVM-BUILD-MANIFEST.txt" <<EOF
          Source commit: $(git rev-parse HEAD)
          Version: $SYSTEMVM_VERSION
          ABLESTACK display version: ${SYSTEMVM_RELEASE_DISPLAY_VERSION:-not-specified}
          Build number: $SYSTEMVM_BUILD_NUMBER
          Architecture: x86_64
          Hypervisor: KVM
          Format: qcow2.bz2
          Packer: $(packer version | head -n 1)
          QEMU: $(qemu-system-x86_64 --version | head -n 1)
          Image: $(basename "$image")
          EOF

      - name: Summarize KVM System VM artifact
        run: |
          image=$(find dist/systemvm-kvm/release -maxdepth 1 -type f -name '*.qcow2.bz2' -printf '%f\n')
          {
            echo "## KVM System VM Template"
            echo
            echo "- Ref: \`$SYSTEMVM_REF\`"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Version: \`$SYSTEMVM_VERSION\`"
            echo "- ABLESTACK display version: \`${SYSTEMVM_RELEASE_DISPLAY_VERSION:-not-specified}\`"
            echo "- Build number: \`$SYSTEMVM_BUILD_NUMBER\`"
            echo "- Hypervisor: \`KVM\`"
            echo "- Architecture: \`x86_64\`"
            echo "- Format: \`qcow2.bz2\`"
            echo "- Image: \`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the same signed runtime payload
        run: |
          runtime_version="${SYSTEMVM_VERSION}-${SYSTEMVM_BUILD_NUMBER}"
          runtime_dir="dist/systemvm-kvm/release/storage-runtime"
          runtime_prefix="ablestack-storage-runtime-${runtime_version}"
          mv "$runtime_dir/manifest.json" "$runtime_dir/${runtime_prefix}.manifest.json"
          mv "$runtime_dir/manifest.sig" "$runtime_dir/${runtime_prefix}.manifest.sig"
          cp "systemvm/debian/etc/ablestack-storage/runtime-trusted-keys/${STORAGE_RUNTIME_SIGNING_KEY_ID}.pem" \
            "$runtime_dir/${STORAGE_RUNTIME_SIGNING_KEY_ID}.pem"
          (
            cd "$runtime_dir"
            rm -f SHA256SUMS
            sha256sum \
              "${runtime_prefix}.tar.gz" \
              "${runtime_prefix}.manifest.json" \
              "${runtime_prefix}.manifest.sig" \
              "${STORAGE_RUNTIME_SIGNING_KEY_ID}.pem" \
              > "${runtime_prefix}.SHA256SUMS"
          )
          {
            echo "- Runtime bundle: \`ablestack-storage-runtime-${runtime_version}.tar.gz\`"
            echo "- Runtime signing key: \`${STORAGE_RUNTIME_SIGNING_KEY_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KVM System VM build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SYSTEMVM_ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/systemvm-kvm/release/**
            dist/systemvm-kvm/systemvm-kvm-build.log

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${STORAGE_RUNTIME_SIGNING_PRIVATE_KEY_FILE:-}" ]; then
            rm -f -- "$STORAGE_RUNTIME_SIGNING_PRIVATE_KEY_FILE"
          fi
